name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

env:
  JAVA_VERSION: '21'

jobs:

  # ===== Build & Test =====
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: helixcart_test
          POSTGRES_USER: helixcart
          POSTGRES_PASSWORD: helixcart
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        working-directory: services/helixcart-app
        run: ./mvnw verify
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/helixcart_test
          DATABASE_USERNAME: helixcart
          DATABASE_PASSWORD: helixcart
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: services/helixcart-app/target/surefire-reports/
          retention-days: 7

  # ===== Static Analysis (SAST) =====
  sast:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        # Degrades gracefully without token — runs in OSS mode with no dashboard
        continue-on-error: true
        with:
          config: >-
            p/java
            p/spring
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ===== Dependency Vulnerability Scan =====
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Set dependency-check cache key
        id: dependency-check-cache
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache dependency-check vulnerability database
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ steps.dependency-check-cache.outputs.week }}-${{ hashFiles('services/helixcart-app/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-${{ steps.dependency-check-cache.outputs.week }}-
            dependency-check-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        # Phase 1: warn-only (continue-on-error: true). Will be enforced as a
        # hard gate in Phase 6 by removing continue-on-error.
        working-directory: services/helixcart-app
        run: |
          if [ -n "${NVD_API_KEY}" ]; then
            ./mvnw org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7 \
              -DnvdApiKey="${NVD_API_KEY}" \
              -DsuppressionFile="owasp-suppressions.xml"
          else
            ./mvnw org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7 \
              -DsuppressionFile="owasp-suppressions.xml"
          fi
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload dependency check report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: services/helixcart-app/target/dependency-check-report.html
          retention-days: 30

  # ===== Container Build & Image Scan =====
  container:
    name: Container Build & Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image metadata
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}/helixcart-app" >> "$GITHUB_OUTPUT"

      - name: Build container image
        # load: true exports the image to the local Docker daemon for Trivy to scan.
        # cache-from uses GHA cache to speed up layer reuse across runs.
        # cache-to is intentionally omitted: the docker-container driver cannot
        # export cache and load to the daemon simultaneously.
        uses: docker/build-push-action@v7
        with:
          context: services/helixcart-app
          push: false
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha

      - name: Scan image with Trivy
        # Pinned to 0.35.0 — the only tag confirmed safe after the March 2026
        # supply chain compromise (CVE-2026-33634) that poisoned 76 of 77 tags.
        # Do NOT use @master or any floating tag. Review when Aqua Security
        # publishes a verified clean release post-compromise.
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Phase 1: warn only, will enforce in Phase 6

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
