spring:
  application:
    name: helixcart-app

  # ===== Database =====
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/helixcart}
    username: ${DATABASE_USERNAME:helixcart}
    password: ${DATABASE_PASSWORD:helixcart}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HelixCartHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns schema — Hibernate must not modify it
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  # ===== Flyway Migrations =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: redis

  # ===== Security / OAuth2 =====
  # Phase 2: Uncomment and configure Zitadel JWKS endpoint
  # security:
  #   oauth2:
  #     resourceserver:
  #       jwt:
  #         issuer-uri: ${ZITADEL_ISSUER_URI}
  #         jwk-set-uri: ${ZITADEL_JWKS_URI}

# ===== Server =====
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful  # Wait for in-flight requests to complete before shutdown
  servlet:
    context-path: /

# ===== Actuator / Observability =====
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true  # Enables /actuator/health/liveness and /actuator/health/readiness
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:local}

# ===== OpenAPI =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  show-actuator: false

# ===== Logging =====
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.helixcart: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  config: classpath:logback-spring.xml
